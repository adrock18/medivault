# Litestream configuration for the container image. Values are expanded from
# environment variables at startup; no credentials are stored in this file.
dbs:
  - path: ${DATA_DIR}/medivault.sqlite
    replica:
      type: s3
      endpoint: '${S3_ENDPOINT}'
      bucket: '${S3_BUCKET}'
      region: '${S3_REGION}'
      path: '${LITESTREAM_REPLICA_PATH}'
      access-key-id: '${S3_ACCESS_KEY_ID}'
      secret-access-key: '${S3_SECRET_ACCESS_KEY}'
      sync-interval: 10s
