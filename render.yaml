# Render Blueprint for the MediVault public demo (free tier, single instance).
# Secrets use `sync: false`: Render prompts for them once in the dashboard; never commit values.
services:
  - type: web
    name: medivault
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY
        value: '1'
      - key: DOCUMENT_STORAGE
        value: s3
      - key: S3_ENDPOINT
        value: https://s3.eu-central-003.backblazeb2.com
      - key: S3_BUCKET
        value: medivault-demo-adrock18
      - key: S3_REGION
        value: eu-central-003
      - key: LITESTREAM_REPLICA_PATH
        value: db
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
