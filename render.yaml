# Render Blueprint for the MediVault public demo (free tier, single instance).
# Secrets use `sync: false`: Render prompts for them once in the dashboard; never commit values.
services:
  - type: web
    name: medivault
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY
        value: '1'
      - key: APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_DOCUMENT_BUCKET
        value: medical-records
