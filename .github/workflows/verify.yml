name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  container:
    name: container image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t medivault:ci .
      - name: Run with local storage
        run: docker run -d --name medivault -p 10000:10000 medivault:ci
      - name: Wait for health and SPA
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:10000/api/health | grep -q '"ok"'; then
              curl -fsS http://localhost:10000/medications | grep -q '<div id="root">'
              exit 0
            fi
            sleep 2
          done
          docker logs medivault
          exit 1
      - name: Assert no secrets or stored documents in image
        run: |
          docker exec medivault sh -c 'test ! -e /app/.env && test ! -e /data/documents && test "$(id -un)" = node'
      - name: Stop container
        if: always()
        run: docker rm -f medivault

  audit:
    name: production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --omit=dev
